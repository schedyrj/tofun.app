# tofun.app — paylaşım linkləri və tətbiq təsdiqi.
#
# Bu fayl AYRI server bloku DEYİL: mövcud `server { server_name tofun.app; ... }`
# blokunun (443, certbot-un yazdığı) İÇİNƏ bir sətirlə qoşulur:
#
#     include /SAYTIN/KÖKÜ/deploy/nginx/tofun.app.locations.conf;
#
# sonra:
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# Yoxlama (üçü də 200 qaytarmalıdır, ilk ikisi `content-type: application/json`):
#
#     curl -sI https://tofun.app/.well-known/apple-app-site-association
#     curl -sI https://tofun.app/.well-known/assetlinks.json
#     curl -sI https://tofun.app/v/1
#
# Cloudflare: "Bot Fight Mode" / "Under Attack" açıqdırsa Apple-ın və Google-ın
# yoxlayıcısı bu faylları ala bilmir və linklər tətbiqi açmır — onda
# `/.well-known/*` üçün istisna qayda yazılmalıdır.

# ── tətbiqin domen təsdiqi ────────────────────────────────────────────────
# iOS faylının UZANTISI YOXDUR və olmamalıdır; nginx onu default olaraq
# `application/octet-stream` verir. Yönləndirmə də olmamalıdır — Apple 301-i
# izləmir.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# ── paylaşım linkləri ─────────────────────────────────────────────────────
# Tətbiq quraşdırılıbsa telefon linki saytdan əvvəl tətbiqə verir və bu
# sorğu heç gəlmir. Gəlirsə — tətbiq yoxdur və ya link tətbiqdaxili
# brauzerdə açılıb: `link.html` "Tətbiqdə aç" düyməsini göstərir. 200 ilə,
# yönləndirmə olmadan — WhatsApp/Telegram önizləməsi 404 səhifəni göstərmir.
location ~ ^/(v|s|x)/[0-9]+/?$ {
    try_files /link.html =404;
}

# ── qalan hər şey ─────────────────────────────────────────────────────────
error_page 404 /404.html;

# Nöqtə ilə başlayan qovluqlar (.git, .idea) açılmır — .well-known istisnadır.
location ~ /\.(?!well-known/) {
    deny all;
}

# Bu qovluğun özü də.
location ^~ /deploy/ {
    deny all;
}
